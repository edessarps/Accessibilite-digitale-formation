<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accessibilité numérique pour PO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap" rel="stylesheet">
<style>
:root {
  /* Un livre de poche numérique : une page courte à la fois, colonne de 65 caractères, pager fixe en bas, surligneur jaune pour les réflexes PO */
  --paper: #FBFBFD;
  --surface: #EEF1F6;
  --ink: #141B24;
  --muted: #4A5563;
  --line: #D3D9E2;
  --accent: #1D4ED8;
  --accent-ink: #FFFFFF;
  --marker: #FFE066;
  --marker-ink: #1A1A1A;
  --good: #0E6B3A;
  --good-bg: #E6F4EC;
  --bad: #B42318;
  --bad-bg: #FCEBE9;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display: "Bricolage Grotesque", "Atkinson Hyperlegible", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F141A;
    --surface: #1A222C;
    --ink: #E9EEF4;
    --muted: #AAB5C3;
    --line: #2E3A48;
    --accent: #8DB4FF;
    --accent-ink: #0B1220;
    --good: #7EDDA6;
    --good-bg: #12291D;
    --bad: #FF9F94;
    --bad-bg: #2E1513;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F141A;
  --surface: #1A222C;
  --ink: #E9EEF4;
  --muted: #AAB5C3;
  --line: #2E3A48;
  --accent: #8DB4FF;
  --accent-ink: #0B1220;
  --good: #7EDDA6;
  --good-bg: #12291D;
  --bad: #FF9F94;
  --bad-bg: #2E1513;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { height: 100%; scroll-padding-top: 96px; scroll-padding-bottom: 96px; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100%;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1.125rem;
  line-height: 1.6;
  display: flex;
  flex-direction: column;
}
@media (max-width: 480px) { body { font-size: 1.0625rem; } }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.skip {
  position: absolute; left: 12px; top: -100px; z-index: 30;
  background: var(--accent); color: var(--accent-ink);
  padding: 12px 16px; border-radius: 8px; font-weight: 700; text-decoration: none;
}
.skip:focus { top: 12px; }

:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
[tabindex="-1"]:focus { outline: none; }

a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }

/* Barre du haut */
.topbar {
  position: sticky; top: 0; z-index: 10;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
}
.topbar-in {
  max-width: 46rem; margin: 0 auto; padding: 10px 16px;
  display: flex; align-items: center; gap: 12px;
}
.topbar-titles { flex: 1; min-width: 0; }
.book { margin: 0; font-size: 0.8125rem; color: var(--muted); font-weight: 700; letter-spacing: 0.02em; }
.chap { margin: 0; font-size: 0.9375rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.progress { height: 4px; background: var(--line); }
.progress-bar { height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }
@media (prefers-reduced-motion: reduce) { .progress-bar { transition: none; } }

/* Boutons */
.btn {
  font: inherit; font-weight: 700; font-size: 1rem;
  min-height: 48px; padding: 0 18px;
  border-radius: 10px; border: 2px solid var(--muted);
  background: transparent; color: var(--ink);
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:hover { background: var(--surface); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { min-height: 44px; padding: 0 14px; font-size: 0.9375rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.linkish {
  font: inherit; color: var(--accent); background: none; border: 0; padding: 4px 0;
  text-align: left; cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
  min-height: 32px;
}

/* Page */
main { flex: 1; width: 100%; }
.page {
  max-width: 40rem; margin: 0 auto; padding: 28px 20px 40px;
}
@media (prefers-reduced-motion: no-preference) {
  .page.enter-next { animation: inNext .24s ease-out; }
  .page.enter-prev { animation: inPrev .24s ease-out; }
  @keyframes inNext { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
  @keyframes inPrev { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
}
.eyebrow {
  margin: 0 0 8px; font-size: 0.875rem; font-weight: 700; color: var(--muted);
  letter-spacing: 0.02em;
}
h1, h2 { font-family: var(--font-display); text-wrap: balance; line-height: 1.15; }
h1 { font-size: clamp(1.65rem, 1.2rem + 2vw, 2.3rem); margin: 0 0 20px; font-weight: 700; letter-spacing: -0.01em; }
.h-small { font-size: 1.125rem; margin: 28px 0 8px; font-weight: 700; }
.body > * + * { margin-top: 16px; }
.body p, .body ul, .body ol { margin: 0; }
.body p + p, .body ul + p, .body p + ul { margin-top: 14px; }
ul, ol { padding-left: 1.25em; }
li + li { margin-top: 8px; }
.lede { font-size: 1.1875rem; color: var(--ink); margin: 0 0 16px; }
.small { font-size: 0.9375rem; color: var(--muted); }
strong { font-weight: 700; }

/* Encadrés */
.crit {
  display: flex; gap: 12px; align-items: baseline;
  background: var(--surface); border-left: 4px solid var(--accent);
  border-radius: 0 8px 8px 0; padding: 10px 14px; font-size: 1rem;
}
.crit + .crit { margin-top: 8px !important; }
.crit-n { font-family: var(--font-mono); font-weight: 700; color: var(--accent); white-space: nowrap; font-size: 0.9375rem; }
.ex { border-radius: 10px; padding: 12px 16px; border: 1px solid; }
.ex-bad { border-color: var(--bad); background: var(--bad-bg); }
.ex-good { border-color: var(--good); background: var(--good-bg); }
.ex-label { margin: 0 0 4px !important; font-weight: 700; font-size: 0.9375rem; }
.ex-bad .ex-label { color: var(--bad); }
.ex-good .ex-label { color: var(--good); }
.ex p + p { margin-top: 8px; }
.callout { border-radius: 10px; padding: 14px 16px; }
.callout-label { margin: 0 0 6px !important; font-weight: 700; font-size: 0.875rem; letter-spacing: 0.02em; }
.callout.real { background: var(--surface); }
.callout.real .callout-label { color: var(--muted); }
.callout.po { background: var(--marker); color: var(--marker-ink); }
.callout.po a { color: var(--marker-ink); }
.callout ul { margin-top: 6px; }
.callout.gherkin { background: var(--surface); border: 1px dashed var(--muted); }
.callout.gherkin .callout-label { color: var(--muted); }
.callout pre, .code pre {
  margin: 0; font-family: var(--font-mono); font-size: 0.9375rem; line-height: 1.55;
  white-space: pre-wrap; word-break: break-word;
}
.code { background: var(--surface); border-radius: 10px; padding: 12px 16px; }
.code-label { margin: 0 0 6px !important; font-size: 0.8125rem; font-weight: 700; color: var(--muted); }
.stat { display: flex; flex-direction: column; gap: 2px; padding: 4px 0; }
.stat-v { font-family: var(--font-display); font-size: 2.4rem; font-weight: 700; color: var(--accent); line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat-t { color: var(--ink); }

/* Couverture */
.cover h1 { font-size: clamp(2rem, 1.4rem + 3vw, 3rem); }
.facts { list-style: none; padding: 0; margin: 24px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.facts li { margin: 0; background: var(--surface); border-radius: 10px; padding: 12px 14px; }
.facts strong { display: block; font-family: var(--font-display); font-size: 1.75rem; color: var(--accent); line-height: 1.1; font-variant-numeric: tabular-nums; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; margin: 24px 0 16px; }
.theme-chip {
  display: inline-block; margin: 0 0 8px; padding: 4px 12px; border-radius: 999px;
  border: 2px solid var(--accent); color: var(--accent); font-weight: 700; font-size: 0.9375rem;
}
.toc-pages li { margin-top: 4px; }

/* Quiz */
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
legend { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; line-height: 1.3; margin-bottom: 16px; padding: 0; }
.opt { position: relative; margin-top: 10px; }
.opt input { position: absolute; left: 16px; top: 18px; width: 22px; height: 22px; margin: 0; accent-color: var(--accent); }
.opt label {
  display: flex; flex-direction: column; gap: 4px;
  padding: 14px 16px 14px 52px; border: 2px solid var(--muted); border-radius: 10px; cursor: pointer;
  min-height: 56px;
}
.opt input:checked + label { border-color: var(--accent); background: var(--surface); }
.opt input:focus-visible + label { outline: 3px solid var(--accent); outline-offset: 3px; }
.opt input:disabled + label { cursor: default; }
.opt.is-right input + label { border-color: var(--good); background: var(--good-bg); }
.opt.is-wrong input + label { border-color: var(--bad); background: var(--bad-bg); }
.opt-tag { font-size: 0.875rem; font-weight: 700; }
.is-right .opt-tag { color: var(--good); }
.is-wrong .opt-tag { color: var(--bad); }
.form-error { color: var(--bad); font-weight: 700; margin: 12px 0 0; }
#quiz-form .btn { margin-top: 20px; }
.feedback { margin-top: 20px; border-radius: 10px; padding: 14px 16px; border: 2px solid; }
.feedback.ok { border-color: var(--good); background: var(--good-bg); }
.feedback.ko { border-color: var(--bad); background: var(--bad-bg); }
.feedback p { margin: 0; }
.feedback p + p { margin-top: 8px; }
.fb-title { font-weight: 700; font-size: 1.125rem; }
.feedback.ok .fb-title { color: var(--good); }
.feedback.ko .fb-title { color: var(--bad); }

/* Bilans */
.score { margin: 0 0 12px; }
.score-v { display: block; font-family: var(--font-display); font-size: 3rem; font-weight: 700; color: var(--accent); line-height: 1.1; font-variant-numeric: tabular-nums; }
.result-list { padding-left: 0; list-style: none; }
.result-list li { display: flex; gap: 12px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--line); margin: 0; }
.r-status { font-weight: 700; font-size: 0.875rem; white-space: nowrap; min-width: 6.5em; }
.r-ok .r-status { color: var(--good); }
.r-ko .r-status { color: var(--bad); }
.r-none .r-status { color: var(--muted); }
.table-wrap { overflow-x: auto; margin-top: 16px; }
table { border-collapse: collapse; width: 100%; font-size: 1rem; }
caption { text-align: left; font-weight: 700; margin-bottom: 8px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
td { font-variant-numeric: tabular-nums; white-space: nowrap; }
thead th { color: var(--muted); font-size: 0.875rem; }
tbody th { font-weight: 400; }

/* Pager */
.pager {
  position: sticky; bottom: 0; z-index: 10;
  background: var(--paper); border-top: 1px solid var(--line);
}
.pager-in {
  max-width: 40rem; margin: 0 auto; padding: 10px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.counter { margin: 0; font-size: 0.9375rem; color: var(--muted); font-variant-numeric: tabular-nums; text-align: center; white-space: nowrap; }
.hint { display: none; }
@media (hover: hover) and (min-width: 700px) { .hint { display: block; font-size: 0.8125rem; color: var(--muted); margin: 0; } }

/* Sommaire */
dialog {
  border: 0; padding: 0; border-radius: 14px; width: min(36rem, calc(100% - 24px));
  max-height: calc(100% - 48px); background: var(--paper); color: var(--ink);
  box-shadow: 0 20px 60px rgba(0,0,0,.35);
}
dialog::backdrop { background: rgba(10, 14, 20, .55); }
.toc-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--paper);
}
.toc-head h2 { margin: 0; font-size: 1.375rem; }
#toc-list { list-style: none; margin: 0; padding: 8px; }
#toc-list li { margin: 0; }
.toc-item {
  width: 100%; font: inherit; color: var(--ink); background: none; border: 0; border-radius: 10px;
  display: grid; grid-template-columns: 2.2em 1fr auto; align-items: center; gap: 8px;
  padding: 10px 12px; text-align: left; cursor: pointer; min-height: 48px;
}
.toc-item:hover { background: var(--surface); }
.toc-item[aria-current="true"] { background: var(--surface); box-shadow: inset 4px 0 0 var(--accent); }
.toc-num { font-family: var(--font-mono); color: var(--muted); font-weight: 700; }
.toc-title { font-weight: 700; }
.toc-meta { font-size: 0.875rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<a class="skip" href="#content">Aller au contenu</a>
<header class="topbar">
  <div class="topbar-in">
    <div class="topbar-titles">
      <p class="book">Accessibilité numérique pour PO</p>
      <p class="chap" id="chap-label">Couverture</p>
    </div>
    <button class="btn small" id="toc-open" type="button" aria-haspopup="dialog">Sommaire</button>
  </div>
  <div class="progress" aria-hidden="true"><div class="progress-bar" id="bar"></div></div>
  <p class="sr-only" id="progress-text"></p>
</header>

<main id="content" tabindex="-1"></main>

<nav class="pager" aria-label="Tourner les pages">
  <div class="pager-in">
    <button class="btn" id="prev" type="button"><span aria-hidden="true">←</span> Précédent</button>
    <div>
      <p class="counter" id="counter"></p>
      <p class="hint">Flèches ← → du clavier</p>
    </div>
    <button class="btn primary" id="next" type="button">Suivant <span aria-hidden="true">→</span></button>
  </div>
</nav>

<dialog id="toc" aria-labelledby="toc-title">
  <div class="toc-head">
    <h2 id="toc-title">Sommaire</h2>
    <button class="btn small" id="toc-close" type="button">Fermer</button>
  </div>
  <ol id="toc-list"></ol>
</dialog>

<script>
/* ---------- Helpers de rédaction ---------- */
const BOOK = [];
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const wrap = t => (t.trim().startsWith('<') ? t : '<p>' + t + '</p>');
const P = t => '<p>' + t + '</p>';
const UL = a => '<ul>' + a.map(i => '<li>' + i + '</li>').join('') + '</ul>';
const OL = a => '<ol>' + a.map(i => '<li>' + i + '</li>').join('') + '</ol>';
const CRIT = (n, t) => '<p class="crit"><span class="crit-n"><span class="sr-only">Critère </span>RGAA ' + n + '</span><span class="crit-t">' + t + '</span></p>';
const DONT = t => '<div class="ex ex-bad"><p class="ex-label"><span aria-hidden="true">✕ </span>À éviter</p>' + wrap(t) + '</div>';
const DO = t => '<div class="ex ex-good"><p class="ex-label"><span aria-hidden="true">✓ </span>À faire</p>' + wrap(t) + '</div>';
const REAL = (who, t) => '<div class="callout real"><p class="callout-label">Dans la vraie vie · ' + who + '</p>' + wrap(t) + '</div>';
const PO = t => '<div class="callout po"><p class="callout-label">Réflexe PO</p>' + wrap(t) + '</div>';
const STAT = (v, t) => '<p class="stat"><span class="stat-v">' + v + '</span><span class="stat-t">' + t + '</span></p>';
const CODE = t => '<div class="code"><p class="code-label">Exemple de code</p><pre><code>' + esc(t) + '</code></pre></div>';
const GH = t => '<div class="callout gherkin"><p class="callout-label">Critère d’acceptation</p><pre>' + esc(t) + '</pre></div>';
const A = (href, text) => '<a href="' + href + '" rel="noopener">' + text + '</a>';
const pg = (t, ...blocks) => ({ t, h: blocks.join('') });
const Q = (q, o, a, e) => ({ q, o, a, e });
const chapter = c => BOOK.push(c);
</script>

<script>
chapter({
  id: 'bienvenue',
  unnumbered: true,
  title: 'Mode d’emploi',
  short: 'Comment lire ce guide, et comment repérer les encadrés.',
  pages: [
    pg('Un guide en petits morceaux',
      P(`Ce guide forme un Product Owner à l’accessibilité numérique, de la question « pourquoi » jusqu’à la recette. Chaque page se lit en une minute environ.`),
      P(`Il suit le RGAA 4.1.2, le référentiel français : chacune de ses 13 thématiques a son chapitre, avec des exemples concrets tirés de sites et d’applications connus.`),
      UL([
        `Pour tourner les pages : les boutons en bas, les flèches ← → du clavier, ou un glissement du doigt.`,
        `Pour sauter à un chapitre : le bouton <strong>Sommaire</strong> en haut.`,
        `À la fin de chaque chapitre : un quiz corrigé. Ton score reste enregistré dans ce navigateur.`
      ])
    ),
    pg('Les encadrés à repérer',
      CRIT('1.1', `Le numéro et l’intitulé d’un critère du RGAA. Les intitulés sont parfois simplifiés pour rester lisibles.`),
      DONT(`Ce qu’on voit trop souvent, et pourquoi ça bloque.`),
      DO(`La bonne pratique correspondante.`),
      REAL('Un site ou une app', `Comment un produit connu applique la règle, ou l’oublie.`),
      PO(`Ce que tu fais concrètement dans ton rôle : une question à poser, un critère d’acceptation à écrire.`)
    ),
    pg('Ce guide applique ce qu’il enseigne',
      P(`Navigation complète au clavier, focus visible, contrastes vérifiés, aucune information portée par la couleur seule, titres structurés, quiz utilisables au lecteur d’écran : ce guide est lui-même un exemple.`),
      P(`La police, Atkinson Hyperlegible, a été dessinée par le Braille Institute pour que chaque lettre reste facile à distinguer, même avec une vue faible.`),
      PO(`Ouvre ce guide avec VoiceOver ou TalkBack activé. Tu entendras comment une interface bien construite est restituée, et tu auras un point de comparaison pour ton propre produit.`)
    )
  ]
});

chapter({
  id: 'fondamentaux',
  title: 'Les fondamentaux',
  short: 'Qui est concerné, comment on navigue avec un handicap, et pourquoi c’est une affaire de produit.',
  pages: [
    pg('L’accessibilité en une phrase',
      P(`Un service numérique est accessible quand toute personne, quel que soit son handicap, peut le percevoir, le comprendre, y naviguer et interagir avec lui.`),
      P(`Ce n’est pas une fonctionnalité de plus. C’est une qualité du produit, comme la performance ou la sécurité : elle se conçoit dès le départ, et elle se dégrade à chaque mise en production si personne n’y veille.`),
      PO(`Traite l’accessibilité comme une exigence permanente, présente dans chaque US, et non comme un ticket à faire « un jour ».`)
    ),
    pg('Qui est concerné ?',
      STAT('1,3 milliard', `de personnes vivent avec un handicap important dans le monde, soit environ 1 personne sur 6 (OMS).`),
      UL([
        `<strong>Visuel</strong> : cécité, malvoyance, daltonisme.`,
        `<strong>Auditif</strong> : surdité, malentendance.`,
        `<strong>Moteur</strong> : difficulté à utiliser une souris, tremblements, paralysie.`,
        `<strong>Cognitif</strong> : dyslexie, troubles de l’attention, de la mémoire ou du langage.`,
        `<strong>Psychique et neurologique</strong> : anxiété, épilepsie photosensible.`
      ]),
      P(`Beaucoup de handicaps sont invisibles. La plupart ne sont pas de naissance : ils arrivent avec l’âge, la maladie ou un accident.`)
    ),
    pg('Permanent, temporaire, situationnel',
      P(`Une même difficulté peut être permanente, temporaire ou liée à la situation du moment.`),
      UL([
        `<strong>Un seul bras disponible</strong> : amputation, bras dans le plâtre, un bébé dans les bras.`,
        `<strong>Voir l’écran</strong> : cécité, suites d’une opération des yeux, plein soleil sur le téléphone.`,
        `<strong>Entendre</strong> : surdité, otite, vidéo regardée dans le métro sans écouteurs.`
      ]),
      P(`Ce modèle, popularisé par la démarche Inclusive Design de Microsoft, montre qu’une solution pensée pour quelques-uns sert à beaucoup. Les sous-titres en sont le meilleur exemple.`)
    ),
    pg('Les aides techniques',
      UL([
        `<strong>Lecteur d’écran</strong> : lit à voix haute ou en braille ce qui est affiché (VoiceOver, TalkBack, NVDA, JAWS).`,
        `<strong>Loupe et zoom</strong> : agrandit une partie de l’écran ou toute la page.`,
        `<strong>Clavier seul ou contacteurs</strong> : pour qui ne peut pas utiliser de souris ni d’écran tactile.`,
        `<strong>Commande vocale</strong> : « Touche Valider », « Fais défiler vers le bas ».`,
        `<strong>Sous-titres et transcriptions</strong> pour l’audio et la vidéo.`,
        `<strong>Réglages du système</strong> : taille du texte, contraste renforcé, réduction des animations.`
      ]),
      PO(`Ton site ne parle pas directement à l’utilisateur : il parle à ces outils. S’il est mal construit, l’outil n’a rien de correct à restituer.`)
    ),
    pg('Comment un aveugle parcourt une page',

        `<strong>Utilisable</strong> : tout fonctionne au clavier, sans limite de temps piégeante, sans risque de crise.`,
        `<strong>Compréhensible</strong> : textes clairs, comportement prévisible, aide en cas d’erreur.`,
        `<strong>Robuste</strong> : le code est interprété correctement par les navigateurs et les aides techniques.`

    pg('Cinq idées reçues',
      UL([
        `<strong>« C’est pour les aveugles. »</strong> Le handicap visuel n’est qu’une partie des besoins : motricité, audition, cognition comptent autant.`,
        `<strong>« Ça coûte cher. »</strong> Ce qui coûte cher, c’est de corriger après coup. Prévue dès la conception, l’accessibilité coûte peu.`,

  quiz: [

      [`1 personne sur 50`, `1 personne sur 20`, `1 personne sur 6`, `1 personne sur 2`], 2,
      `Environ 1,3 milliard de personnes, soit 16 %. Et la part augmente avec le vieillissement de la population.`),
    Q(`Comment la majorité des utilisateurs de lecteur d’écran explorent-ils d’abord une longue page ?`,
      [`En lisant tout de haut en bas`, `En naviguant de titre en titre`, `En parcourant les images`, `En utilisant le plan du site`], 1,
      `71,6 % naviguent par les titres selon l’enquête WebAIM. D’où l’importance de vrais titres bien hiérarchisés.`),
    Q(`Une personne regarde une vidéo dans le métro sans écouteurs. Sa situation de handicap est…`,
      [`permanente`, `temporaire`, `situationnelle`, `inexistante`], 2,
      `C’est une situation passagère liée au contexte. Les sous-titres conçus pour les personnes sourdes l’aident aussi.`),
    Q(`Quelle est l’erreur la plus fréquente sur les pages d’accueil selon le WebAIM Million 2026 ?`,
      [`Les images sans alternative`, `Le texte pas assez contrasté`, `L’absence de titres`, `Les vidéos sans sous-titres`], 1,
      `83,9 % des pages ont du texte trop peu contrasté. C’est une décision de charte graphique, donc un sujet produit et design.`),
    Q(`Que signifie le principe « Robuste » ?`,
      [`Le site ne tombe jamais en panne`, `Le code est interprété correctement par les navigateurs et les aides techniques`, `Le site résiste aux attaques informatiques`, `Le site fonctionne hors connexion`], 1,
      `Un code propre et standard permet aux aides techniques, présentes et futures, de restituer correctement le contenu.`),
    Q(`Un widget « accessibilité » ajouté par un script tiers…`,
      [`rend le site conforme au RGAA`, `remplace un audit`, `ne corrige pas le code et ne garantit pas la conformité`, `est obligatoire depuis 2025`], 2,

<script>

  const save = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} };

  let n = 0;
  BOOK.forEach(c => { c.quiz = c.quiz || []; c.num = c.unnumbered ? null : ++n; });

  const seq = [{ type: 'cover', hash: 'couverture' }];
  BOOK.forEach((c, ci) => {
    seq.push({ type: 'intro', ci, hash: c.id });
    c.pages.forEach((p, pi) => seq.push({ type: 'page', ci, pi, hash: c.id + '-' + (pi + 1) }));
    c.quiz.forEach((q, qi) => seq.push({ type: 'quiz', ci, qi, hash: c.id + '-quiz-' + (qi + 1) }));
    if (c.quiz.length) seq.push({ type: 'result', ci, hash: c.id + '-bilan' });
  });
  seq.push({ type: 'end', hash: 'bilan-final' });
  const total = seq.length;
  const savedIdx = Math.min(Math.max(0, state.idx), total - 1);
  let idx = 0;

  const $ = s => document.querySelector(s);
  const main = $('#content'), prevB = $('#prev'), nextB = $('#next'), counter = $('#counter');
  const bar = $('#bar'), chapLabel = $('#chap-label'), progressText = $('#progress-text');
  const toc = $('#toc'), tocList = $('#toc-list');

  const key = (ci, qi) => ci + '-' + qi;
  const idxOf = (ci, type, i) => seq.findIndex(v => v.ci === ci && v.type === type && (i === undefined || v.pi === i || v.qi === i));
  const label = c => c.num ? 'Chapitre ' + c.num + ' · ' + c.title : c.title;
  const score = ci => {
    const c = BOOK[ci]; let ok = 0, done = 0;
    c.quiz.forEach((q, qi) => { const a = state.answers[key(ci, qi)]; if (a !== undefined) { done++; if (a === q.a) ok++; } });
    return { ok, done, total: c.quiz.length };
  };

  function viewCover() {
    const pages = BOOK.reduce((s, c) => s + c.pages.length, 0);
    const qs = BOOK.reduce((s, c) => s + c.quiz.length, 0);
    const chs = BOOK.filter(c => c.num).length;
    const resume = savedIdx > 0
      ? '<button class="btn primary" type="button" data-go="' + savedIdx + '">Reprendre à la page ' + (savedIdx + 1) + '</button><button class="btn" type="button" data-go="1">Lire depuis le début</button>'
      : '<button class="btn primary" type="button" data-go="1">Commencer la lecture</button>';
    return '<article class="page cover">' +
      '<p class="eyebrow">Guide interactif · RGAA 4.1.2</p>' +
      '<h1 id="page-title" tabindex="-1">Accessibilité numérique : le guide du PO</h1>' +
      '<p class="lede">Ce qu’un Product Owner doit savoir pour concevoir, spécifier et recetter des services accessibles. En pages courtes, avec des exemples tirés de sites et d’apps connus, et un quiz à chaque chapitre.</p>' +
      '<ul class="facts">' +
      '<li><strong>' + chs + '</strong> chapitres</li>' +
      '<li><strong>13</strong> thématiques du RGAA</li>' +
      '<li><strong>' + pages + '</strong> pages d’une minute</li>' +
      '<li><strong>' + qs + '</strong> questions de quiz</li>' +
      '</ul>' +
      '<div class="actions">' + resume + '<button class="btn" type="button" data-toc>Voir le sommaire</button></div>' +
      '<p class="small">À jour en novembre 2026. Basé sur le RGAA 4.1.2 et les WCAG 2.1 et 2.2. Ta progression et tes réponses restent dans ce navigateur.</p>' +
      '</article>';
  }

  function viewIntro(ci) {
    const c = BOOK[ci], nq = c.quiz.length;
    const items = c.pages.map((p, pi) => '<li><button class="linkish" type="button" data-go="' + idxOf(ci, 'page', pi) + '">' + p.t + '</button></li>').join('') +
      (nq ? '<li><button class="linkish" type="button" data-go="' + idxOf(ci, 'quiz', 0) + '">Quiz\u00A0: ' + nq + ' questions</button></li>' : '');
    const mins = Math.max(2, Math.round(c.pages.length + nq * 0.5));
    return '<article class="page intro">' +
      '<p class="eyebrow">' + (c.num ? 'Chapitre ' + c.num : 'Avant de commencer') + '</p>' +
      '<h1 id="page-title" tabindex="-1">' + c.title + '</h1>' +
      (c.theme ? '<p class="theme-chip">' + c.theme + '</p>' : '') +
      '<p class="lede">' + c.short + '</p>' +
      '<h2 class="h-small">Au programme</h2><ol class="toc-pages">' + items + '</ol>' +
      '<p class="small">' + c.pages.length + ' pages' + (nq ? ' · ' + nq + ' questions' : '') + ' · environ ' + mins + ' min</p>' +
      '</article>';
  }

  function viewPage(ci, pi) {
    const c = BOOK[ci], p = c.pages[pi];
    return '<article class="page">' +
      '<p class="eyebrow">' + label(c) + ' · page ' + (pi + 1) + ' sur ' + c.pages.length + '</p>' +
      '<h1 id="page-title" tabindex="-1">' + p.t + '</h1>' +
      '<div class="body">' + p.h + '</div></article>';
  }

  function feedback(q, ans) {
    const ok = ans === q.a;
    return '<div class="feedback ' + (ok ? 'ok' : 'ko') + '" id="feedback" tabindex="-1">' +
      '<p class="fb-title"><span aria-hidden="true">' + (ok ? '✓ ' : '✕ ') + '</span>' + (ok ? 'Bonne réponse' : 'Pas tout à fait') + '</p>' +
      (ok ? '' : '<p>La bonne réponse\u00A0: <strong>' + q.o[q.a] + '</strong></p>') +
      '<p>' + q.e + '</p></div>';
  }

  // Ordre d'affichage des réponses : mélangé de façon stable, sauf pour les échelles numériques
  function order(q) {
    if (q._p) return q._p;
    const a = q.o.map((_, i) => i);
    const numeric = q.o.filter(o => /^\d/.test(o)).length >= 3;
    if (!numeric) {
      let s = 7;
      for (const ch of q.q) s = (Math.imul(s, 31) + ch.charCodeAt(0)) | 0;
      const rnd = () => {
        s = (s + 0x6D2B79F5) | 0;
        let t = Math.imul(s ^ (s >>> 15), 1 | s);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(rnd() * (i + 1));
        const t = a[i]; a[i] = a[j]; a[j] = t;
      }
    }
    q._p = a;
    return a;
  }

  function viewQuiz(ci, qi) {
    const c = BOOK[ci], q = c.quiz[qi], ans = state.answers[key(ci, qi)], answered = ans !== undefined;
    const opts = order(q).map(oi => {
      const o = q.o[oi];
      let cls = '', tag = '';
      if (answered && oi === q.a) { cls = ' is-right'; tag = '<span class="opt-tag">Bonne réponse</span>'; }
      else if (answered && oi === ans) { cls = ' is-wrong'; tag = '<span class="opt-tag">Ta réponse</span>'; }
      return '<div class="opt' + cls + '"><input type="radio" name="answer" id="opt-' + oi + '" value="' + oi + '"' +
        (answered ? ' disabled' : '') + (ans === oi ? ' checked' : '') + '><label for="opt-' + oi + '"><span>' + o + '</span>' + tag + '</label></div>';
    }).join('');
    return '<article class="page quiz">' +
      '<p class="eyebrow">Quiz · ' + label(c) + '</p>' +
      '<h1 id="page-title" tabindex="-1">Question ' + (qi + 1) + ' sur ' + c.quiz.length + '</h1>' +
      '<form id="quiz-form" novalidate><fieldset><legend>' + q.q + '</legend>' + opts + '</fieldset>' +
      (answered ? '' : '<p class="form-error" id="quiz-error" hidden>Choisis une réponse avant de valider.</p><button type="submit" class="btn primary">Valider ma réponse</button>') +
      '</form>' + (answered ? feedback(q, ans) : '') + '</article>';
  }

  function message(ok, tot) {
    const r = tot ? ok / tot : 0;
    if (r >= 0.8) return 'Très bien : ce chapitre est acquis.';
    if (r >= 0.5) return 'Bon début. Relis les explications des questions à revoir avant de continuer.';
    return 'Prends le temps de relire le chapitre : les explications de chaque question t’aideront.';
  }

  function viewResult(ci) {
    const c = BOOK[ci], s = score(ci);
    const rows = c.quiz.map((q, qi) => {
      const a = state.answers[key(ci, qi)];
      const st = a === undefined ? ['r-none', 'Sans réponse'] : (a === q.a ? ['r-ok', 'Juste'] : ['r-ko', 'À revoir']);
      return '<li class="' + st[0] + '"><span class="r-status">' + st[1] + '</span><button class="linkish" type="button" data-go="' + idxOf(ci, 'quiz', qi) + '">' + q.q + '</button></li>';
    }).join('');
    return '<article class="page result">' +
      '<p class="eyebrow">' + label(c) + '</p>' +
      '<h1 id="page-title" tabindex="-1">' + (c.finalQuiz ? 'Bilan du quiz final' : 'Bilan du chapitre') + '</h1>' +
      '<p class="score"><span class="score-v">' + s.ok + ' / ' + s.total + '</span>bonnes réponses' + (s.done < s.total ? ' (' + (s.total - s.done) + ' sans réponse)' : '') + '</p>' +
      '<p>' + message(s.ok, s.total) + '</p>' +
      '<h2 class="h-small">Détail des questions</h2><ol class="result-list">' + rows + '</ol>' +
      '<div class="actions"><button class="btn" type="button" data-reset="' + ci + '">Refaire ce quiz</button>' +
      '<button class="btn" type="button" data-go="' + idxOf(ci, 'intro') + '">Revoir le chapitre</button></div></article>';
  }

  function viewEnd() {
    let ok = 0, tot = 0;
    const rows = BOOK.map((c, ci) => {
      if (!c.quiz.length) return '';
      const s = score(ci); ok += s.ok; tot += s.total;
      return '<tr><th scope="row">' + (c.num ? c.num + '. ' : '') + c.title + '</th><td>' + s.ok + ' / ' + s.total + '</td></tr>';
    }).join('');
    return '<article class="page end">' +
      '<p class="eyebrow">Fin du guide</p>' +
      '<h1 id="page-title" tabindex="-1">Bilan final</h1>' +
      '<p class="score"><span class="score-v">' + ok + ' / ' + tot + '</span>bonnes réponses sur l’ensemble des quiz</p>' +
      '<p>' + message(ok, tot) + ' La suite se joue sur le terrain : un parcours testé au clavier chaque semaine, et l’accessibilité dans chaque critère d’acceptation.</p>' +
      '<div class="table-wrap"><table><caption>Score par chapitre</caption><thead><tr><th scope="col">Chapitre</th><th scope="col">Score</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<div class="actions"><button class="btn" type="button" data-toc>Ouvrir le sommaire</button><button class="btn" type="button" data-reset-all>Effacer toutes mes réponses</button></div>' +
      '</article>';
  }

  function render(focus, dir) {
    const v = seq[idx];
    let html;
    if (v.type === 'cover') html = viewCover();
    else if (v.type === 'intro') html = viewIntro(v.ci);
    else if (v.type === 'page') html = viewPage(v.ci, v.pi);
    else if (v.type === 'quiz') html = viewQuiz(v.ci, v.qi);
    else if (v.type === 'result') html = viewResult(v.ci);
    else html = viewEnd();
    main.innerHTML = html;
    const art = main.querySelector('.page');
    if (dir && art) art.classList.add(dir > 0 ? 'enter-next' : 'enter-prev');

    chapLabel.textContent = v.ci !== undefined ? label(BOOK[v.ci]) : (v.type === 'end' ? 'Bilan final' : 'Couverture');
    counter.innerHTML = '<span class="sr-only">Page </span>' + (idx + 1) + '\u00A0/\u00A0' + total;
    const pct = Math.round(idx / (total - 1) * 100);
    bar.style.width = pct + '%';
    progressText.textContent = 'Progression\u00A0: ' + pct + '\u00A0%';
    prevB.disabled = idx === 0;
    nextB.disabled = idx === total - 1;
    nextB.innerHTML = (v.type === 'cover' ? 'Commencer' : 'Suivant') + ' <span aria-hidden="true">→</span>';

    if (location.hash.slice(1) !== v.hash) { try { history.replaceState(null, '', '#' + v.hash); } catch (e) {} }
    if (v.type !== 'cover') { state.idx = idx; save(); }

    const form = main.querySelector('#quiz-form');
    if (form && v.type === 'quiz') {
      form.addEventListener('submit', e => {
        e.preventDefault();
        const checked = form.querySelector('input[name="answer"]:checked');
        if (!checked) {
          const err = form.querySelector('#quiz-error');
          err.hidden = false; err.setAttribute('role', 'alert');
          form.querySelector('input[name="answer"]').focus();
          return;
        }
        state.answers[key(v.ci, v.qi)] = Number(checked.value);
        save();
        render(false);
        const fb = main.querySelector('#feedback');
        if (fb) { fb.focus(); fb.scrollIntoView({ block: 'nearest' }); }
      });
    }
    if (focus) {
      window.scrollTo(0, 0);
      const h = main.querySelector('h1');
      if (h) h.focus({ preventScroll: true });
    }
  }

  function go(i, dir) {
    i = Math.max(0, Math.min(total - 1, i));
    if (i === idx) return;
    const d = dir !== undefined ? dir : (i > idx ? 1 : -1);
    idx = i;
    render(true, d);
  }

  prevB.addEventListener('click', () => go(idx - 1, -1));
  nextB.addEventListener('click', () => go(idx + 1, 1));

  main.addEventListener('click', e => {
    const t = e.target.closest('button');
    if (!t) return;
    if (t.hasAttribute('data-go')) go(Number(t.getAttribute('data-go')));
    else if (t.hasAttribute('data-toc')) openToc();
    else if (t.hasAttribute('data-reset')) {
      const ci = Number(t.getAttribute('data-reset'));
      BOOK[ci].quiz.forEach((q, qi) => { delete state.answers[key(ci, qi)]; });
      save(); go(idxOf(ci, 'quiz', 0));
    } else if (t.hasAttribute('data-reset-all')) {
      state.answers = {}; save(); render(true);
    }
  });

  document.addEventListener('keydown', e => {
    if (toc.open) return;
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    const tg = e.target;
    if (tg && tg.closest && tg.closest('input, textarea, select, [contenteditable="true"]')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); go(idx + 1, 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); go(idx - 1, -1); }
  });

  let sx = null, sy = null;
  main.addEventListener('touchstart', e => {
    if (e.touches.length !== 1 || e.target.closest('.table-wrap, pre')) { sx = null; return; }
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, { passive: true });
  main.addEventListener('touchend', e => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    sx = null;
    if (Math.abs(dx) > 70 && Math.abs(dy) < 50) go(idx + (dx < 0 ? 1 : -1), dx < 0 ? 1 : -1);
  }, { passive: true });

  function currentCi() { const v = seq[idx]; return v.ci; }
  function openToc() {
    const cur = currentCi();
    let html = '<li><button class="toc-item" type="button" data-go-toc="0"' + (seq[idx].type === 'cover' ? ' aria-current="true"' : '') + '><span class="toc-num"></span><span class="toc-title">Couverture</span><span class="toc-meta"></span></button></li>';
    BOOK.forEach((c, ci) => {
      const s = score(ci);
      const meta = c.quiz.length ? (s.done ? s.ok + ' / ' + s.total : c.quiz.length + ' questions') : c.pages.length + ' pages';
      const metaSr = c.quiz.length ? (s.done ? ', quiz\u00A0: ' + s.ok + ' bonnes réponses sur ' + s.total : ', quiz pas encore fait') : '';
      html += '<li><button class="toc-item" type="button" data-go-toc="' + idxOf(ci, 'intro') + '"' + (cur === ci ? ' aria-current="true"' : '') + '>' +
        '<span class="toc-num">' + (c.num || '') + '</span><span class="toc-title">' + c.title + '<span class="sr-only">' + metaSr + '</span></span>' +
        '<span class="toc-meta" aria-hidden="true">' + meta + '</span></button></li>';
    });
    html += '<li><button class="toc-item" type="button" data-go-toc="' + (total - 1) + '"' + (seq[idx].type === 'end' ? ' aria-current="true"' : '') + '><span class="toc-num"></span><span class="toc-title">Bilan final</span><span class="toc-meta"></span></button></li>';
    tocList.innerHTML = html;
    if (typeof toc.showModal === 'function') toc.showModal(); else toc.setAttribute('open', '');
    const curBtn = tocList.querySelector('[aria-current="true"]') || tocList.querySelector('button');
    if (curBtn) { curBtn.focus(); curBtn.scrollIntoView({ block: 'center' }); }
  }
  function closeToc() { if (typeof toc.close === 'function') toc.close(); else toc.removeAttribute('open'); }
  $('#toc-open').addEventListener('click', openToc);
  $('#toc-close').addEventListener('click', closeToc);
  toc.addEventListener('click', e => {
    if (e.target === toc) { closeToc(); return; }
    const b = e.target.closest('[data-go-toc]');
    if (b) { closeToc(); const i = Number(b.getAttribute('data-go-toc')); if (i === idx) render(true); else go(i); }
  });

  function fromHash() {
    const h = decodeURIComponent(location.hash.slice(1));
    if (!h) return -1;
    return seq.findIndex(v => v.hash === h);
  }
  window.addEventListener('hashchange', () => { const i = fromHash(); if (i >= 0 && i !== idx) go(i); });

  const start = fromHash();
  idx = start >= 0 ? start : 0;
  render(false);
})();
</script>
</body>
</html>
